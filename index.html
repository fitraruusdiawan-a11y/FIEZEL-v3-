<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FIEZEL">
<meta name="theme-color" content="#0a0a0c">
<link rel="manifest" href="./manifest.json">
<title>FIEZEL — Belajar Bahasa Inggris Offline</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Fraunces:wght@500;700&display=swap');
:root{
  --bg:#0a0a0c; --surface:#17171b; --border:#26262c; --muted:#9a9aa3;
  --primary:#6366f1; --primary2:#818cf8; --success:#22c55e; --danger:#f43f5e; --ink:#f4f4f6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;padding-bottom:90px}
h1,h2,h3{font-family:'Fraunces',serif;margin:0}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px}
.p-3{padding:12px}.p-4{padding:16px}.p-5{padding:20px}.p-6{padding:24px}.pl-4{padding-left:16px}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}.mb-5{margin-bottom:20px}.mb-6{margin-bottom:24px}
.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-5{margin-top:20px}.py-12{padding:48px 0}
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}.text-center{text-align:center}
.gap-3{gap:12px}.gap-4{gap:16px}.px-2{padding-left:8px;padding-right:8px}
.grid{display:grid}.grid-cols-2{grid-template-columns:1fr 1fr}
.w-full{width:100%}.flex-1{flex:1}
.hidden{display:none!important}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.badge{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.04em;color:var(--primary2);background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.3);padding:5px 10px;border-radius:999px;margin-bottom:14px}
.hero{font-size:2rem;line-height:1.15;font-weight:700;margin-bottom:10px}
.accent{color:var(--primary2)}
.sub{font-size:.9rem;color:var(--muted);line-height:1.5;margin-bottom:20px}
.sub2{font-size:.78rem;color:var(--muted);margin-top:4px}
.label{font-size:.68rem;font-weight:800;color:#6b6b74;letter-spacing:.04em}
.stat{font-size:1.25rem;font-weight:800;color:var(--primary2);margin-top:4px}
.stat.green,.green{color:var(--success)}
.bad{color:var(--danger)}
.progress{height:8px;background:#232329;border-radius:999px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));transition:width .4s ease}
.btn{border:none;border-radius:14px;padding:14px 16px;font-weight:700;font-size:.9rem;cursor:pointer;font-family:inherit}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
.btn.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--border)}
.btn.danger{color:var(--danger)}
.btn.text-xs{font-size:.75rem;padding:9px 14px}
.linklike{background:none;border:none;color:var(--muted);font-weight:700;font-size:.85rem;cursor:pointer;font-family:inherit}
.listcard{width:100%;border:1px solid var(--border);cursor:pointer;transition:border-color .15s}
.listcard:hover{border-color:rgba(99,102,241,.5)}
.section-title{font-size:1.5rem;margin-bottom:6px}
.cap{text-transform:capitalize}
.eyebrow{font-size:.62rem;font-weight:800;letter-spacing:.08em;color:var(--primary2);text-transform:uppercase}
.qnum{font-weight:700;font-size:.8rem;margin-top:2px}
.streak{font-size:.85rem;font-weight:800;padding:8px 12px;background:#1e1e24;border-radius:12px;border:1px solid var(--border)}
.question{font-size:1.35rem;font-weight:800;line-height:1.4;margin-bottom:22px}
.blank{display:inline-block;min-width:60px;border-bottom:4px solid var(--primary2);margin:0 4px}
.option{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;font-size:.92rem;color:var(--ink);cursor:pointer;font-family:inherit}
.option:disabled{cursor:default}
.option.correct{border-color:var(--success);background:rgba(34,197,94,.1)}
.option.wrong{border-color:var(--danger);background:rgba(244,63,94,.1)}
.feedback{border-top:4px solid var(--primary)}
.ftitle{font-size:1rem}
.ftitle.ok{color:var(--success)}
.ftitle.bad{color:var(--danger)}
.frule{font-size:.85rem;color:var(--ink);margin-top:8px;font-weight:600}
.fwhy{font-size:.82rem;color:var(--muted);margin-top:6px}
.fstrategy{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.2);font-size:.8rem;color:var(--primary2)}
.bigscore{font-size:3.2rem;font-weight:800;color:var(--success);margin:18px 0}
.passage{font-size:.88rem;line-height:1.65;color:#dcdce0;margin-top:10px}
.flashcard{perspective:1000px;height:280px;cursor:pointer}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;border:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center;transform-style:preserve-3d;transition:transform .5s ease}
.flashcard{position:relative}
.flashcard .front{transform:rotateY(0)}
.flashcard .back{transform:rotateY(180deg);background:#161425}
.flashcard.flipped .front{transform:rotateY(180deg)}
.flashcard.flipped .back{transform:rotateY(360deg)}
.fcword{font-family:'Fraunces',serif;font-size:1.8rem;font-weight:700}
.fcphon{color:var(--muted);margin-top:6px}
.fcmeaning{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:700;color:var(--primary2)}
.fcex{color:var(--muted);font-size:.85rem;margin-top:10px}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,12,.9);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px 6px calc(10px + env(safe-area-inset-bottom))}
.nav button{background:none;border:none;color:var(--muted);font-size:.65rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:inherit}
.nav button .ic{font-size:1.15rem}
.nav button.active{color:var(--primary2)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="nav hidden" id="nav">
  <button id="n-home" onclick="go('home')"><span class="ic">🏠</span>Beranda</button>
  <button id="n-grammar" onclick="go('grammar')"><span class="ic">🧩</span>Grammar</button>
  <button id="n-vocab" onclick="go('vocab')"><span class="ic">🧠</span>Vocab</button>
  <button id="n-reading" onclick="go('reading')"><span class="ic">📖</span>Reading</button>
  <button id="n-profile" onclick="go('profile')"><span class="ic">👤</span>Profil</button>
</nav>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
  });
}
</script>
</body>
</html>
